name: windows
on:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # windows-latest moved to VS 2026. Keep the requested VS 2022 compiler.
      - name: Ensure VS 2022 C++ build tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs2022 = & $vswhere -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs2022) {
            Invoke-WebRequest https://aka.ms/vs/17/release/vs_BuildTools.exe -OutFile "$env:RUNNER_TEMP\vs2022.exe"
            $installer = Start-Process "$env:RUNNER_TEMP\vs2022.exe" -WindowStyle Hidden -Wait -PassThru -ArgumentList '--quiet','--wait','--norestart','--nocache','--add','Microsoft.VisualStudio.Workload.VCTools','--includeRecommended'
            if ($installer.ExitCode -notin 0,3010) { throw "VS 2022 installation failed: $($installer.ExitCode)" }
          }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
      - name: Configure VS 2022 and Ninja
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3, Standalone and checks
        run: cmake --build build --parallel 3
      - name: Core and preset tests
        shell: pwsh
        run: |
          & ./build/dvlce_capsule_core_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/plugin/DvlceCapsulePresetTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offscreen snapshots at 100 percent
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path snapshots
          & ./build/plugin/DvlceCapsuleSnapshot.exe snapshots/editor.png 0 1100 520
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/plugin/DvlceCapsuleSnapshot.exe snapshots/editor-alternate.png 1 1100 520
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-snapshots
          path: snapshots/*.png
          if-no-files-found: error
      - name: pluginval strictness 10
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $pv = (Get-ChildItem pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1).FullName
          & $pv --strictness-level 10 --skip-gui-tests --validate-in-process --validate "build/plugin/DvlceCapsule_artefacts/Release/VST3/Dvlce Capsule.vst3" | Tee-Object -FilePath pluginval.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: pluginval.log
      - uses: actions/upload-artifact@v4
        with:
          name: windows-plugins
          path: |
            build/plugin/DvlceCapsule_artefacts/Release/VST3
            build/plugin/DvlceCapsule_artefacts/Release/Standalone
